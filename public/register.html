<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#FF8D21" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Recorder Registration · Studio Project Manila</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%23FF8D21'/><circle cx='16' cy='16' r='5' fill='%231f1300'/></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script>
    try { const t = localStorage.getItem('spl-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch {}
  </script>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body class="register-page">
  <main class="reg-wrap">
    <div class="brand reg-brand"><span class="name"><span class="dot"></span>Studio Project Manila</span>
      <button type="button" class="icon-btn theme-toggle" aria-label="Switch light/dark mode"></button></div>
    <div id="reg"></div>
  </main>
  <div id="toast" role="status"></div>
  <script type="module" src="/register.js"></script>
</body>
</html>
